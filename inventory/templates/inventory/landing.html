<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Department</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
<div class="container text-center">
    <div class="mb-5">
        <h1 class="display-4 fw-bold">Production Inventory System Portal</h1>
        <p class="text-muted">Select Item type to continue</p>
    </div>

    <div class="row justify-content-center gap-4">
        <div class="col-md-4">
            <div class="card shadow-lg border-0 h-100 py-5 hover-card">
                <div class="card-body">
                    <h1 style="font-size: 4rem;">⚙️</h1>
                    <h3 class="card-title mt-3">Parts</h3>
                    <p class="text-muted mb-4">Request motors, controllers, and electronics.</p>
                    <a href="{% url 'dashboard' 'Part' %}" class="btn btn-primary btn-lg w-100">Enter Parts</a>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card shadow-lg border-0 h-100 py-5 hover-card">
                <div class="card-body">
                    <h1 style="font-size: 4rem;">🔩</h1>
                    <h3 class="card-title mt-3">Fasteners</h3>
                    <p class="text-muted mb-4">Request screws, bolts, nuts, washers, etc.</p>
                    <a href="{% url 'dashboard' 'Fastener' %}" class="btn btn-secondary btn-lg w-100">Enter Fasteners</a>
                </div>
            </div>
        </div>
    </div>
    
    <div class="mt-5">
        <span class="text-muted">Logged in as: <strong>{{ request.user.username }}</strong></span>
        <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger ms-3">Logout</a>
    </div>
</div>

</body>
</html>
